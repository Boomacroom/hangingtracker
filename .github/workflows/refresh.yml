name: refresh

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Ensure db
        run: test -f data/tracker.db || python -m tracker.cli init

      # GDELT only. WONDER is a manual export: the API returns 403 for any
      # state-level query, so there is nothing to automate there.
      - name: Collect news candidates
        run: python -m tracker.cli news --timespan 2d
        continue-on-error: true

      - name: Flag developments on existing cases
        run: python tools/followup.py || true

      - name: Build site data
        run: python tools/export_site.py

      # main is protected, so the bot opens a PR instead of pushing.
      # Candidates are raw scraped rows, not curated claims, but they still
      # land in the same file as the case records, so they go through review
      # like everything else.
      - name: Open PR with new candidates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "refresh: candidates ${{ github.run_number }}"
          branch: auto/refresh
          delete-branch: true
          title: "Daily refresh: new candidates"
          body: |
            Automated GDELT collection. Nothing here is a case record.

            Before merging, skim the run log for the "Flag developments"
            step: if it lists coverage matching an existing case, that
            case may have a ruling to record via
            `python tools/followup.py --update <id>`.
          add-paths: |
            data/tracker.db
            site/data
