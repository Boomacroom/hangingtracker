name: refresh

# Case collection is frozen. The daily cron is deliberately removed
# rather than commented out, because a commented cron is one edit away
# from restarting a queue nobody is triaging any more, and an untriaged
# candidates table rots into a liability.
#
# The case list is an appendix with a freeze date, not a live tracker.
# If a ruling lands on one of the nine records, run this by hand from the
# Actions tab, or just run tools/followup.py locally. Everything here
# still works; it simply does not run on a timer.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Ensure db
        run: test -f data/tracker.db || python -m tracker.cli init

      # GDELT only. WONDER is a manual export: the API returns 403 for any
      # state-level query, so there is nothing to automate there.
      # 7d, not 2d. gdelt.py rotates through its query list two per run to
      # stay under the request budget, so any single query only comes up
      # every ~2.5 days. The window has to be wider than that gap or the
      # days a query sits out are simply never searched, and a gap in this
      # table is indistinguishable from a quiet week. Overlap is free: the
      # candidates table dedupes on url.
      - name: Collect news candidates
        run: python -m tracker.cli news --timespan 7d
        continue-on-error: true

      - name: Flag developments on existing cases
        run: python tools/followup.py || true

      - name: Build site data
        run: python tools/export_site.py

      # main is protected, so the bot opens a PR instead of pushing.
      # Candidates are raw scraped rows, not curated claims, but they still
      # land in the same file as the case records, so they go through review
      # like everything else.
      - name: Open PR with new candidates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "refresh: candidates ${{ github.run_number }}"
          branch: auto/refresh
          delete-branch: true
          title: "Daily refresh: new candidates"
          body: |
            Automated GDELT collection. Nothing here is a case record.

            Before merging, skim the run log for the "Flag developments"
            step: if it lists coverage matching an existing case, that
            case may have a ruling to record via
            `python tools/followup.py --update <id>`.
          add-paths: |
            data/tracker.db
            site/data
